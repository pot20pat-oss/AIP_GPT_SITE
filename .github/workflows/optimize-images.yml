name: Optimize heavy site images

on:
  push:
    paths:
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build responsive Atelier hero assets
        run: |
          set -euo pipefail

          curl -fsSL https://atelierpotvin.ca/aip-hero.webp -o /tmp/aip-hero.webp

          convert /tmp/aip-hero.webp \
            -resize '800x>' \
            -strip \
            -quality 72 \
            -define webp:method=6 \
            public/aip-hero-800.webp

          convert /tmp/aip-hero.webp \
            -resize '1200x>' \
            -strip \
            -quality 78 \
            -define webp:method=6 \
            public/aip-hero-1200.webp

          ls -lh /tmp/aip-hero.webp public/aip-hero-800.webp public/aip-hero-1200.webp

      - name: Commit optimized assets
        run: |
          if git diff --quiet -- public/aip-hero-800.webp public/aip-hero-1200.webp && \
             [ -f public/aip-hero-800.webp ] && [ -f public/aip-hero-1200.webp ]; then
            echo "Responsive hero assets are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add public/aip-hero-800.webp public/aip-hero-1200.webp
          git commit -m "Add responsive Atelier hero images"
          git push

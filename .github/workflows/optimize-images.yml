name: Optimize current homepage hero images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image conversion dependency
        run: python3 -m pip install --user Pillow

      - name: Convert current Atelier hero images and update responsive markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          assets = Path("public/HERO")
          page = Path("app/page.tsx")
          text = page.read_text(encoding="utf-8")

          originals = {
              "desktop": assets / "atelier-potvin-desktop.png",
              "mobile": assets / "atelier-potvin-mobile.png",
          }
          for name, source in originals.items():
              if not source.is_file():
                  raise SystemExit(f"Required current {name} hero missing: {source}")

          variants = {"desktop": [640, 960, 1280, 1600], "mobile": [480, 768]}
          for kind, widths in variants.items():
              with Image.open(originals[kind]) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  for requested_width in widths:
                      width = min(im.width, requested_width)
                      height = round(im.height * width / im.width)
                      resized = im.resize((width, height), Image.Resampling.LANCZOS)
                      destination = assets / f"atelier-potvin-{kind}-{requested_width}.webp"
                      resized.save(destination, "WEBP", quality=78, method=6)
                      print(f"{destination}: {destination.stat().st_size:,} bytes ({width}x{height})")

          old = '<picture><source media="(max-width: 640px)" srcSet="/HERO/atelier-potvin-mobile.png" /><img className="hero-clean-bg" src="/HERO/atelier-potvin-desktop.png" alt="Patrick Potvin dans son atelier informatique à Nicolet" width="1731" height="909" loading="eager" fetchPriority="high" decoding="async" /></picture>'
          new = '<picture><source media="(max-width: 640px)" srcSet="/HERO/atelier-potvin-mobile-480.webp 480w, /HERO/atelier-potvin-mobile-768.webp 768w" sizes="100vw" type="image/webp" /><source srcSet="/HERO/atelier-potvin-desktop-640.webp 640w, /HERO/atelier-potvin-desktop-960.webp 960w, /HERO/atelier-potvin-desktop-1280.webp 1280w, /HERO/atelier-potvin-desktop-1600.webp 1600w" sizes="100vw" type="image/webp" /><img className="hero-clean-bg" src="/HERO/atelier-potvin-desktop.png" alt="Patrick Potvin dans son atelier informatique à Nicolet" width="1731" height="909" loading="eager" fetchPriority="high" decoding="async" /></picture>'
          if old not in text and new not in text:
              raise SystemExit("Homepage hero markup differs from audited state; no modification made")
          if old in text:
              text = text.replace(old, new, 1)
              page.write_text(text, encoding="utf-8")
          PY

      - name: Optimize shared branding assets without replacing originals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Path("public/aip-icon-v7.png")
          if not source.is_file():
              raise SystemExit(f"Logo source missing: {source}")
          with Image.open(source) as image:
              logo = ImageOps.exif_transpose(image).convert("RGBA")
              header = logo.copy()
              header.thumbnail((320, 320), Image.Resampling.LANCZOS)
              header.save("public/aip-icon-header.webp", "WEBP", quality=82, method=6)
              icon = logo.copy()
              icon.thumbnail((192, 192), Image.Resampling.LANCZOS)
              icon.save("public/aip-icon-small.png", "PNG", optimize=True)
              print("Original:", source.stat().st_size, "Header:", Path("public/aip-icon-header.webp").stat().st_size, "Icon:", Path("public/aip-icon-small.png").stat().st_size)

          components = Path("app/components.tsx")
          text = components.read_text(encoding="utf-8")
          old = "/aip-icon-v7.png?v=13"
          new = "/aip-icon-header.webp"
          if old not in text and new not in text:
              raise SystemExit("Header/footer icon URL changed; stop to avoid unintended modifications")
          components.write_text(text.replace(old, new), encoding="utf-8")

          layout = Path("app/layout.tsx")
          text = layout.read_text(encoding="utf-8")
          old = "/aip-icon-v7.png?v=13"
          new = "/aip-icon-small.png?v=1"
          if old not in text and new not in text:
              raise SystemExit("Favicon URL changed; stop to avoid unintended modifications")
          layout.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit images and markup atomically
        run: |
          set -euo pipefail
          git add app/page.tsx app/components.tsx app/layout.tsx public/aip-icon-header.webp public/aip-icon-small.png public/HERO/atelier-potvin-desktop-*.webp public/HERO/atelier-potvin-mobile-*.webp
          if git diff --cached --quiet; then
            echo "All current hero variants are already optimized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize current Atelier hero for responsive WebP loading"
          git pull --rebase origin main
          git push origin HEAD:main

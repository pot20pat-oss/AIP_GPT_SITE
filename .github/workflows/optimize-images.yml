name: Optimize heavy site images

on:
  push:
    paths:
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build responsive Atelier hero assets
        run: |
          set -euo pipefail

          curl -fsSL https://atelierpotvin.ca/aip-hero.webp -o /tmp/aip-hero.webp

          convert /tmp/aip-hero.webp \
            -resize '640x>' \
            -strip \
            -quality 68 \
            -define webp:method=6 \
            public/aip-hero-640.webp

          convert /tmp/aip-hero.webp \
            -resize '960x>' \
            -strip \
            -quality 72 \
            -define webp:method=6 \
            public/aip-hero-960.webp

          convert /tmp/aip-hero.webp \
            -resize '1280x>' \
            -strip \
            -quality 76 \
            -define webp:method=6 \
            public/aip-hero-1280.webp

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/page.tsx")
          s = p.read_text(encoding="utf-8")
          old = '<img className="hero-clean-bg" src="/aip-hero.webp" alt="Atelier Informatique Potvin" width="1672" height="941" loading="eager" fetchPriority="high" decoding="async" />'
          new = '<img className="hero-clean-bg" src="/aip-hero.webp" srcSet="/aip-hero-640.webp 640w, /aip-hero-960.webp 960w, /aip-hero-1280.webp 1280w, /aip-hero.webp 1672w" sizes="100vw" alt="Atelier Informatique Potvin" width="1672" height="941" loading="eager" fetchPriority="high" decoding="async" />'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

          ls -lh /tmp/aip-hero.webp public/aip-hero-640.webp public/aip-hero-960.webp public/aip-hero-1280.webp

      - name: Commit optimized assets
        run: |
          if [ -z "$(git status --porcelain -- public/aip-hero-640.webp public/aip-hero-960.webp public/aip-hero-1280.webp app/page.tsx)" ]; then
            echo "Responsive hero assets are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add public/aip-hero-640.webp public/aip-hero-960.webp public/aip-hero-1280.webp app/page.tsx
          git commit -m "Serve responsive Atelier hero image"
          git push
